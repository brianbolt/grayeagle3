name: Update Airbnb rating

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays, 8am Pacific
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-rating.mjs
      - name: Commit and redeploy if the rating changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/data/rating.json; then
            echo "Rating unchanged; nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Airbnb rating ($(jq -r '"\(.rating) from \(.reviewCount) reviews"' src/data/rating.json))"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
